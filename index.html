<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pix Premiado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}
    header{text-align:center;padding:20px}
    h1{color:#d4af37}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px}
    .num{padding:14px;border-radius:10px;text-align:center;font-weight:bold;cursor:pointer}
    .available{background:#1b1b1b}
    .reserved{background:#7f8c8d;cursor:not-allowed}
    .sold{background:#e74c3c;cursor:not-allowed}
    .wrap{max-width:1000px;margin:auto;padding:16px}
    button{padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold;background:#2ecc71}
    input,textarea{width:100%;padding:10px;border-radius:8px;margin-bottom:8px;border:none}
    #admin{display:none}
  </style>
</head>
<body>

<header>
  <h1>PIX PREMIADO</h1>
  <p>Escolha seu número e participe</p>
</header>

<div id="public" class="wrap">
  <h2>Escolha um número</h2>
  <div id="grid" class="grid"></div>
  <br>
  <button id="btn" disabled>Confirmar no WhatsApp</button>
</div>

<div id="admin" class="wrap">
  <h2>Painel Administrativo</h2>
  <input id="raffleName" placeholder="Nome do sorteio">
  <input id="totalNumbers" type="number" placeholder="Quantidade de números">
  <input id="price" type="number" placeholder="Valor por número">
  <textarea id="prizes" placeholder="Premiação"></textarea>
  <button onclick="createRaffle()">Criar Sorteio</button>
</div>

<script>
// CONFIGURAÇÕES
const WHATSAPP = '5593991804791';
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_DOMINIO.firebaseapp.com",
  databaseURL: "https://SEU_DOMINIO.firebaseio.com",
  projectId: "SEU_PROJECT_ID",
  appId: "APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let TOTAL = 150;
let PRICE = 15;
let selected = null;

const grid = document.getElementById('grid');
const btn = document.getElementById('btn');

function buildGrid(){
  grid.innerHTML='';
  for(let i=1;i<=TOTAL;i++){
    const n = String(i).padStart(2,'0');
    const d = document.createElement('div');
    d.innerText = n;
    d.className = 'num available';
    d.onclick = ()=>selectNumber(n);
    grid.appendChild(d);
  }
}

function selectNumber(n){
  selected = n;
  btn.disabled=false;
  btn.innerText = 'Confirmar número '+n;
}

btn.onclick = ()=>{
  const msg = `Olá! Escolhi o número ${selected} no Pix Premiado.`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
}

// ADMIN
function showAdmin(){
  document.getElementById('admin').style.display='block';
  document.getElementById('public').style.display='none';
}

if(location.search.includes('admin')){
  auth.onAuthStateChanged(user=>{
    if(user){
      showAdmin();
    } else {
      const email = prompt('Email do admin:');
      const pass = prompt('Senha do admin:');
      auth.signInWithEmailAndPassword(email,pass)
        .then(showAdmin)
        .catch(()=>alert('Acesso negado'));
    }
  })
}

function createRaffle(){
  const name = document.getElementById('raffleName').value;
  TOTAL = Number(document.getElementById('totalNumbers').value);
  PRICE = Number(document.getElementById('price').value);
  const prizes = document.getElementById('prizes').value;

  db.ref('raffles').push({name,TOTAL,PRICE,prizes,created:Date.now()});
  alert('Sorteio criado com sucesso');
}

buildGrid();
</script>

</body>
</html>
